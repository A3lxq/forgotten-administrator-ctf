{% extends "base.html" %}
{% block title %}Record #{{ record["id"] }}{% endblock %}
{% block content %}

  <p class="meta">Owner: {{ record["owner"] }} &middot; record id {{ record["id"] }}</p>
  <div class="card">
    <pre>{{ record["body"] }}</pre>
  </div>
{% endblock %}
