{% extends "base.html" %}
{% block title %}Instructor sign-in{% endblock %}
{% block content %}
  <h1>Instructor sign-in</h1>
  <div class="card">
    {% if error %}<p class="flash-error">{{ error }}</p>{% endif %}
    <form method="post" class="auth-form">
      <div class="field">
        <label for="passcode">Admin passcode</label>
        <input id="passcode" name="passcode" type="password" autocomplete="off" autofocus>
      </div>
      <button type="submit" class="btn-primary">Sign in</button>
    </form>
  </div>
{% endblock %}
